name: Installation and usage / 安装与使用咨询
description: Ask about setup, configuration or a workflow / 咨询部署、配置与创作流程
title: "[Help] "
body:
  - type: markdown
    attributes:
      value: |
        Read the README and deploy/README.md first. 请先查阅使用与部署说明。
        Never paste passwords, API keys, complete configuration files or private access links.
  - type: input
    id: version
    attributes:
      label: AID version / 版本
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and deployment mode / 环境与部署方式
      description: OS, architecture, memory, Docker or systemd; add browser version if relevant / 系统、架构、内存、Docker 或 systemd，必要时注明浏览器。
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Goal and where you are stuck / 目标与遇到的困难
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: What you tried / 已尝试的方法
      description: Include relevant documentation links and minimal redacted error excerpts / 附相关文档链接及最小脱敏错误片段。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / 隐私检查
      options:
        - label: I removed credentials, private addresses and personal data. / 已移除凭证、私有地址和个人数据。
          required: true
