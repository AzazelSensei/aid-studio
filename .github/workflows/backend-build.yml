name: Backend build

on:
  pull_request:
    paths:
      - "pom.xml"
      - "aid-admin/**"
      - "aid-business/**"
      - "aid-common/**"
      - "aid-consumer/**"
      - "aid-interface/**"
      - ".github/workflows/backend-build.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "pom.xml"
      - "aid-admin/**"
      - "aid-business/**"
      - "aid-common/**"
      - "aid-consumer/**"
      - "aid-interface/**"
      - ".github/workflows/backend-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Maven package (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build backend
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests
